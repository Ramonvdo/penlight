name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # All actions are pinned to full commit SHAs: this workflow holds
      # release-publishing rights, so a retargeted upstream tag must never be
      # able to run code here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # npm/cargo build scripts must not be able to read the
          # contents:write token out of .git/config.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The pinned SHA no longer names the toolchain (the ref usually does),
      # so it is passed explicitly.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Penlight v__VERSION__"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/Ramonvdo/penlight/blob/main/CHANGELOG.md) for what's new.

            The installer is per-user (no admin needed). Builds are not yet code-signed, so
            SmartScreen may warn on first launch: choose **More info → Run anyway**, or verify
            the download against `SHA256SUMS.txt` below / build from source.
          releaseDraft: true
          prerelease: false

      - name: Attach SHA-256 checksums to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          UPLOAD_URL: ${{ steps.tauri.outputs.releaseUploadUrl }}
        run: |
          $paths = $env:ARTIFACT_PATHS | ConvertFrom-Json
          $lines = foreach ($p in $paths) {
            if (Test-Path $p) {
              "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -Path $p).Hash.ToLower(), (Split-Path $p -Leaf)
            }
          }
          if (-not $lines) { throw "no artifacts found to checksum" }
          $lines | Out-File SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          $url = ($env:UPLOAD_URL -replace '\{[^}]*\}$', '') + '?name=SHA256SUMS.txt'
          gh api --method POST $url --input SHA256SUMS.txt -H "Content-Type: text/plain" | Out-Null
